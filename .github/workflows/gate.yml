name: wallpaper-gate

# Mandatory verification gate: no APK reaches the user without passing this.
# Boots an API-34 emulator, installs the debug APK, sets it as the live
# wallpaper, and PROVES motion (pixel diff between two screenshots 8s apart)
# plus no crash in logcat for the wallpaper process.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    # Manual emulator boot: the reactivecircus action's boot-wait times out
    # because (a) ubuntu runners hide /dev/kvm from the runner user and
    # (b) macos-14 runners lack HVF. Here we join the kvm group via sg and
    # boot the emulator ourselves with a generous poll loop.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the Android SDK preinstalled; on ubuntu it is
      # /usr/local/lib/android/sdk. Just ensure the packages we need.
      - name: Ensure Android packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          # cmdline-tools version dir varies by runner image; pick whatever exists
          CT=$(ls -d "$ANDROID_HOME"/cmdline-tools/* | head -1)
          export PATH="$CT/bin:$PATH"   # immediate, for the sdkmanager calls below
          echo "$CT/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "emulator" "system-images;android-34;google_apis;x86_64"
          sdkmanager --list_installed | grep -E "platform-tools|android-34|34.0.0|emulator|system-images" | head -10

      - name: Build debug APK
        working-directory: android
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle assembleDebug --no-daemon

      - name: Boot emulator (manual, KVM via sg)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"
          sudo gpasswd -a "$USER" kvm || true
          ls -la /dev/kvm || true
          sg kvm -c "echo KVM_GROUP_OK" || echo "NO_KVM_GROUP"
          # Create the AVD; avdmanager can fail silently, so verify and fall
          # back to writing the AVD config files directly.
          echo "no" | avdmanager --verbose create avd --force -n gate34 \
            --package "system-images;android-34;google_apis;x86_64" --device "pixel_6" || true
          avdmanager list avd || true
          if [ ! -f ~/.android/avd/gate34.ini ]; then
            echo "avdmanager did not create gate34; writing AVD config manually"
            mkdir -p ~/.android/avd/gate34.avd
            SYSIMG="system-images/android-34/google_apis/x86_64"
            ls "$ANDROID_HOME/$SYSIMG" | head -5
            cat > ~/.android/avd/gate34.ini << EOF
          avd.ini.encoding=UTF-8
          path=$HOME/.android/avd/gate34.avd
          path.rel=avd/gate34.avd
          target=android-34
          EOF
            cat > ~/.android/avd/gate34.avd/config.ini << EOF
          avd.ini.encoding=UTF-8
          AvdId=gate34
          PlayStore.enabled=false
          abi.type=x86_64
          avd.ini.displayname=gate34
          disc.cachePartition=true
          disc.cachePartition.size=66MB
          fastboot.chosenSnapshotFile=
          fastboot.forceChosenSnapshotBoot=no
          fastboot.forceColdBoot=no
          fastboot.forceFastBoot=yes
          hw.accelerometer=yes
          hw.arc=false
          hw.audioInput=yes
          hw.battery=yes
          hw.camera.back=none
          hw.camera.front=none
          hw.cpu.arch=x86_64
          hw.cpu.ncore=4
          hw.dPad=no
          hw.device.hash2=MD5:3db3250dab5d0d93b30d7e8de1cfd3c7b
          hw.device.manufacturer=Google
          hw.device.name=pixel_6
          hw.gps=yes
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.initialOrientation=Portrait
          hw.keyboard=yes
          hw.lcd.density=420
          hw.lcd.height=2400
          hw.lcd.width=1080
          hw.mainKeys=no
          hw.ramSize=2048
          hw.sdCard=yes
          hw.sensors.orientation=yes
          hw.sensors.proximity=yes
          hw.trackBall=no
          image.sysdir.1=$SYSIMG/
          runtime.network.latency=none
          runtime.network.speed=full
          sdcard.size=512M
          showDeviceFrame=no
          skin.dynamic=yes
          skin.name=1080x2400
          skin.path=_no_skin
          tag.display=Google APIs
          tag.id=google_apis
          vm.heapSize=228
          EOF
            ls ~/.android/avd/
          fi
          test -f ~/.android/avd/gate34.ini || { echo "AVD CREATION FAILED"; exit 1; }
          echo "AVD ready"
          sg kvm -c "nohup $ANDROID_HOME/emulator/emulator -avd gate34 -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none > /tmp/emu.log 2>&1 &"
          sleep 20
          for i in $(seq 1 100); do
            if adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; then
              echo "BOOTED after ~$((i*15+20))s"; break
            fi
            if [ $((i % 8)) -eq 0 ]; then echo "still waiting... ${i}x15s"; tail -2 /tmp/emu.log | cut -c1-160; fi
            sleep 15
          done
          adb shell getprop sys.boot_completed | grep -q 1 || { echo "BOOT TIMEOUT"; tail -30 /tmp/emu.log; exit 1; }
          adb shell input keyevent 82 || true
          sleep 3

      - name: Gate — install, bind wallpaper, prove motion
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          adb install -r "$APK"
          # Bind the live wallpaper: `cmd wallpaper` has no set-component on
          # API 34 and the API needs a signature permission, so as root we
          # inject the component into wallpaper_info.xml (the exact format
          # WallpaperManagerService parses on boot) and reboot.
          adb root
          adb wait-for-device
          adb pull /data/system/users/0/wallpaper_info.xml /tmp/wallpaper_info.xml
          python3 - << 'EOF'
          import re
          p = "/tmp/wallpaper_info.xml"
          xml = open(p).read()
          comp = "com.apexforge.mandalawallpaper/com.apexforge.mandalawallpaper.MandalaWallpaperService"
          xml2, n = re.subn(r'(<wp\b[^>]*?)(/?>)',
                            lambda m: m.group(1) + ' component="%s"' % comp + m.group(2),
                            xml, count=1)
          assert n == 1, "no <wp> tag found in wallpaper_info.xml"
          open(p, "w").write(xml2)
          print("component injected into wallpaper_info.xml")
          EOF
          adb push /tmp/wallpaper_info.xml /data/system/users/0/wallpaper_info.xml
          adb shell "chmod 600 /data/system/users/0/wallpaper_info.xml && chown system:system /data/system/users/0/wallpaper_info.xml"
          adb reboot
          adb wait-for-device
          for i in $(seq 1 40); do
            sleep 15
            adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1 && { echo "REBOOTED"; break; }
          done
          adb shell getprop sys.boot_completed | grep -q 1 || { echo "REBOOT TIMEOUT"; exit 1; }
          adb shell input keyevent 82 || true
          sleep 10
          echo "--- bound wallpaper component ---"
          adb shell dumpsys wallpaper | grep -m1 "mWallpaperComponent" || true
          adb shell dumpsys wallpaper | grep -m1 "mandalawallpaper" || (echo "WALLPAPER NOT BOUND"; exit 1)
          echo "--- engine liveness ---"
          adb shell dumpsys wallpaper | grep -iA2 "Wallpaper connection" | head -8 || true
          adb shell screencap -p /sdcard/shot_a.png
          sleep 8
          adb shell screencap -p /sdcard/shot_b.png
          adb pull /sdcard/shot_a.png /tmp/shot_a.png
          adb pull /sdcard/shot_b.png /tmp/shot_b.png
          python3 "$GITHUB_WORKSPACE/.github/workflows/pixeldiff.py" /tmp/shot_a.png /tmp/shot_b.png
          echo "--- crash/ANR check ---"
          if adb logcat -d | grep -i "FATAL EXCEPTION" | grep -i "mandalawallpaper"; then
            echo "CRASH FOUND in wallpaper process"; exit 1
          fi
          if adb logcat -d | grep -iE "ANR in" | grep -i "mandalawallpaper"; then
            echo "ANR FOUND in wallpaper process"; exit 1
          fi
          echo "no crash/ANR in wallpaper process"

      - name: Upload gate screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-screenshots
          path: /tmp/shot_*.png
